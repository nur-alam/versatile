name: Deploy to SVN 
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  Deploy-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml

      - name: Install Composer and SVN
        run: sudo apt-get update && sudo apt-get install -y composer subversion
      
      - name: Install WP CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o wp-cli.phar
          php wp-cli.phar --info
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          wp --info

      - name: Run php
        run: php -v

      - name: Run composer
        run: composer install

      - name: Verify WP CLI installation
        run: wp --info

      - name: Extract version number
        id: get_version
        run: |
          version=$(grep -Po 'Version:\s*\K[\d.]+(?:-[\w]+)?' versatile-toolkit.php)
          echo "VERSION_NUMBER=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build Plugin
        run: npm run build

      - name: Verify dist files
        run: |
          find assets/dist -type f

      - name: Extract release notes from readme changelog
        run: |
          awk -v version="$VERSION_NUMBER" '
            $0 == "= " version " =" { in_section=1; next }
            in_section && /^= [0-9]/ { exit }
            in_section && /^== / { exit }
            in_section { print }
          ' readme.txt > RELEASE_NOTES.txt

          sed -i '/^[[:space:]]*$/d' RELEASE_NOTES.txt

          if [ ! -s RELEASE_NOTES.txt ]; then
            echo "Failed to extract release notes for version $VERSION_NUMBER from readme.txt"
            exit 1
          fi

          cat RELEASE_NOTES.txt
          
      # - name: WordPress Plugin Deploy
      #   id: deploy
      #   uses: 10up/action-wordpress-plugin-deploy@stable
      #   env:
      #     SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      #     SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
      #     SLUG: versatile-toolkit

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: ../versatile-toolkit-${{ steps.get_version.outputs.version }}.zip
          body_path: RELEASE_NOTES.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
